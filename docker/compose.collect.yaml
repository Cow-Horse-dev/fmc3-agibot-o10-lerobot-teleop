services:
  arm-hand-teleop:
    image: ${ARM_HAND_TELEOP_IMAGE:-arm-hand-teleop:collect}
    build:
      context: ..
      dockerfile: docker/Dockerfile.collect
    container_name: arm-hand-teleop
    privileged: true
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    working_dir: /root/workspace/arm-hand-teleop
    environment:
      ARM_HAND_TELEOP_PYTHON: /opt/miniconda3/envs/arm-hand-teleop/bin/python
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # 代码目录：先 git clone 到宿主机，再挂载进来
      - ${CODE_ROOT:-~/workspace/arm-hand-teleop}:/root/workspace/arm-hand-teleop
      - ${DATASET_ROOT:-~/workspace/dataset}:/root/workspace/dataset
    command: /bin/bash -lc "sleep infinity"
