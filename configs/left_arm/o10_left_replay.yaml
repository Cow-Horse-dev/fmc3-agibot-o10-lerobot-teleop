# O10 单臂回放配置（左臂）
# 供脚本 `./scripts/o10/left_arm/replay_o10_left.sh` 使用。
# 虽然文件名里还叫 `left`，但现在可以直接靠 YAML 里的 handedness 切左右。
#
# 这份文件用于把已经录好的 LeRobot 数据集动作回放到 O10 左臂上。
# 使用前最重要的是改 `dataset.root` 到你要回放的那个具体数据集目录。
#
# 参数速查：
# 可选值速查（本文件字段）：
# - dataset.repo_id: null 或数据集名字符串；dataset.root/reset_poses_path: 路径字符串。
# - replay.episode_index/fps/device_id/canfd_id: 整数。
# - robot.type: pico_follower_single_arm_agibot_o10；id: 任意日志名字符串。
# - port: can0/can1 或实际 CAN 口；handedness: left, right。
# - action_control_mode: joint, eef_delta, eef_absolute；hand_action_mode 有该项时可选 dexterous_10d, gripper_1d。
# - channel_mode: multiChannel；channel_id: null 或整数，null 自动 left->0、right->1。
# - gripper_gesture/reset_gesture: pinch, tripod, cylindrical。
# - dataset.repo_id: 数据集名字；当 root 已经指向具体目录时可保持 null。
# - dataset.root: 要回放的 LeRobot 数据集目录，必须指向实际存在的数据集。
# - replay.episode_index: 回放第几个 episode，从 0 开始。
# - replay.fps: 回放频率，通常与录制 fps 一致。
# - robot: 回放时连接的 follower 机器人配置。
# - robot.type/id: 机器人类型和日志名；单臂 O10 固定使用 pico_follower_single_arm_agibot_o10。
# - robot.port: 机械臂 CAN 接口；左臂通常是 can0。
# - robot.handedness: 执行回放的物理手/臂方向。
# - robot.action_control_mode: 必须与数据集 action schema 一致。
# - robot.channel_mode: O10 手 CANFD 通道模式，目前实际使用 multiChannel。
# - robot.device_id / canfd_id / channel_id: OmniHand 设备、适配器和通道编号。
# - robot.reset_poses_path / reset_gesture: 回放前后 reset 使用的 JSON 和手势。

dataset:
  # 数据集名字。
  # 如果 `root` 已经直接写到了具体数据集目录，这里可以留空。
  repo_id: null

  # 要回放的具体数据集目录。
  # 这里应当直接指向某一个已经录好的数据集目录，例如：
  # ~/workspace/dataset/Robot/agi_arm_bot/pick_and_place_20260410
  root: ~/workspace/dataset/Robot/agi_arm_bot/pick_up_the_blue_camera_from_the_yellow_paper_into_black_box_20260415_merged

replay:
  # 回放第几个 episode，从 0 开始编号。
  episode_index: 3

  # 回放频率，单位 Hz。
  fps: 30

robot:
  # 机器人类型。
  # 当前 O10 左臂固定使用这个值。
  type: pico_follower_single_arm_agibot_o10

  # 机械臂 CAN 口。
  port: can0

  # 机器人名字，仅用于日志显示。
  id: o10_left

  # 选择"哪只 follower 手/臂"执行回放。
  handedness: left
  action_control_mode: joint  # 与数据集 action schema 保持一致：joint, eef_delta, eef_absolute

  # O10 手通道模式。
  # 当前代码真正支持的只有：
  # - multiChannel
  channel_mode: multiChannel

  # OmniHand device_id。
  device_id: 1

  # CANFD 适配器编号。
  canfd_id: 0

  # O10 channel_id。
  # 保持 null 时会自动跟随 robot.handedness：
  # - left  -> 0
  # - right -> 1
  channel_id: null

  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: pinch
