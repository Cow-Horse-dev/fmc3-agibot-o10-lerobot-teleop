# O10 单臂录制配置（左臂）
# 供脚本 `./scripts/o10/left_arm/record_o10_left.sh` 使用。
#
# 这份文件负责把数据录成 LeRobot 数据集格式。
# 当前已经配置成：
# - 数据保存在 ~/workspace/dataset/Robot/agi_arm_bot 下面
# - 目录名自动按"任务名 + 当天日期"生成
# 虽然文件名里还叫 `left`，但现在可以直接靠 YAML 里的 handedness 切左右。
#
# 参数速查：
# 可选值速查（本文件字段）：
# - teleop.type: pico_leader_single_arm_agibot_o10；robot.type: pico_follower_single_arm_agibot_o10。
# - id/task_description/single_task/repo_id: 普通字符串；port: can0/can1 或实际 CAN 口。
# - handedness/controller_side: left, right；wrist_pose_source: auto, left, right；vr_device: pico, pico_wrist。
# - enable_hand/include_eef_pose/display_data/auto_name_from_task_date/video/mcap/is_ssh/use_depth: true, false。
# - hand_mode: glove, trigger_gesture；trigger_gesture/reset_gesture: pinch, tripod, cylindrical。
# - action_control_mode: joint, eef_delta；hand_action_mode 有该项时可选 dexterous_10d, gripper_1d。
# - tactile_mode: none, 130d；channel_mode: multiChannel。
# - channel_id: null 或整数，null 自动 left->0、right->1。
# - reset_poses_path/root/index_or_path/serial_number_or_name: 路径或设备名字符串。
# - camera.type: opencv, intelrealsense, realsense；color_mode: RGB/BGR 或 rgb/bgr。
# - fourcc: null 或 4 字符编码，常见 MJPG/YUYV/YUY2/I420/H264，是否可用取决于相机驱动。
# - rotation: NO_ROTATION, ROTATE_90, ROTATE_180, ROTATE_270。
# - vr_pose_port/vr_ctrl_port/fps/width/height/device_id/canfd_id/num_episodes/*_time_sec/写入线程和批量大小: 整数。
# - date_format: Python strftime 格式，例如 "%Y%m%d" 或 "%Y-%m-%d"。
# - robot: 实际被录制和被控制的 follower 机器人端配置。
# - robot.type/id: 机器人类型和日志名；单臂 O10 固定使用 pico_follower_single_arm_agibot_o10。
# - robot.port: 机械臂 CAN 接口；左臂通常是 can0。
# - robot.handedness: 当前录制的物理手/臂方向。
# - robot.enable_hand: 是否连接并录制 O10 手。
# - robot.include_eef_pose: 是否把末端位姿额外加入 observation.state；必须与训练/推理一致。
# - robot.action_control_mode: joint 录关节目标；eef_delta 录末端增量。
# - robot.tactile_mode: 触觉特征维度；none/130d 必须与训练一致。
# - robot.channel_mode: O10 手 CANFD 通道模式，目前实际使用 multiChannel。
# - robot.device_id / canfd_id / channel_id: OmniHand 设备、适配器和通道编号。
# - robot.reset_poses_path / reset_gesture: reset 使用的 JSON 和手势。
# - robot.cameras: 录入数据集的相机配置；key 名会成为 observation.images.<key>。
# - camera.type: realsense/intelrealsense 读 RealSense；opencv 读普通 USB 相机。
# - camera.index_or_path / serial_number_or_name: OpenCV 设备路径或 RealSense 序列号。
# - camera.width/height/fps/fourcc/use_depth/color_mode/rotation: 图像尺寸、帧率、编码、深度、颜色顺序和旋转。
# - teleop: 录制时的遥操作端配置，决定 Pico 输入如何变成 action。
# - teleop.type/id: 遥操作器类型和日志名；单臂 O10 固定使用 pico_leader_single_arm_agibot_o10。
# - teleop.handedness: 遥操作输出对应的手/臂方向。
# - teleop.controller_side: 哪只 Pico 手柄负责开始、复位和按住使能；左臂这里使用右手柄。
# - teleop.vr_pose_port / vr_ctrl_port: Pico 位姿流和按键/扳机流的 UDP 端口。
# - teleop.vr_device: VR 数据来源；pico 表示使用 Pico 手柄/腕部数据。
# - teleop.wrist_pose_source: 机械臂读取哪个 wrist pose；left/right 强制指定，auto 自动选择。
# - teleop.enable_hand: 是否把手部动作写入 action。
# - teleop.hand_mode: glove 使用手套 10D 数据；trigger_gesture 使用 Pico grip 映射预设手势。
# - teleop.trigger_gesture: trigger_gesture 模式下 grip 控制的预设手势。
# - teleop.action_control_mode: 必须和 robot.action_control_mode 保持一致。
# - teleop.reset_poses_path / reset_gesture: 遥操作 reset 使用的 JSON 和手势。
# - run.fps: 录制主循环频率。
# - run.display_data: 是否打开本地预览窗口。
# - run.num_episodes / episode_time_sec / reset_time_sec: episode 数、单条时长和 reset 时长字段。
# - run.single_task: 任务文本；也会用于自动生成数据集目录名。
# - dataset.auto_name_from_task_date / date_format: 是否按任务名+日期自动命名数据集目录。
# - dataset.repo_id: 手动数据集目录名；auto_name_from_task_date=false 时使用。
# - dataset.root: 数据集根目录；最终数据会写到 root/repo_id 或 root/自动目录名。
# - dataset.video / mcap: 相机保存为视频还是 MCAP。
# - dataset.is_ssh: SSH/无桌面环境提示开关。
# - dataset.num_image_writer_threads_per_camera / num_image_writer_processes: 图像写入并发数。
# - dataset.video_encoding_batch_size: 每多少个 episode 批量编码一次视频。

robot:
  # 机器人类型。
  type: pico_follower_single_arm_agibot_o10

  # 机械臂 CAN 口。
  port: can0

  # 机器人名字，仅用于日志显示。
  id: o10_left

  # 选择"哪只 follower 手/臂"被录制并接收动作。
  handedness: left
  enable_hand: true
  include_eef_pose: false
  action_control_mode: joint  # joint, eef_delta
  tactile_mode: "none"  # 也决定数据集 root 子目录 (none -> without_tactile, 其他 -> with_tactile)

  # O10 手通道模式。
  # 当前代码真正支持的只有：
  # - multiChannel
  channel_mode: multiChannel

  # OmniHand device_id。
  device_id: 1

  # CANFD 适配器编号。
  canfd_id: 0

  # O10 channel_id。
  # 保持 null 时会自动跟随 robot.handedness：
  # - left  -> 0
  # - right -> 1
  channel_id: null

  # 当前起始姿态会在 connect 时自动写回这里，后续 return_zero / reset 都回到这组关节。
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: pinch

  camera_config_path: configs/cameras/o10_cameras.yaml
  cameras:
    left: left_wrist
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: ROTATE_180

teleop:
  # 遥操作器类型。
  type: pico_leader_single_arm_agibot_o10

  # 遥操作器名字，仅用于日志显示。
  id: pico_left

  # 左臂录制时仍录左臂；左手柄控制左臂和左手，右手柄 A/B/RTr 负责开始、复位和按住使能。
  handedness: left
  controller_side: right

  # Pico wrist 位姿流端口。
  vr_pose_port: 8000

  # Pico wrist 控制按键 / 扳机流端口。
  vr_ctrl_port: 8001

  # VR 设备来源。
  vr_device: pico

  # 位姿控制来源。
  # 可选值：auto / left / right
  wrist_pose_source: left

  # 是否启用手控制。
  # - true: 手 + 臂一起录
  # - false: 只录机械臂
  enable_hand: true
  hand_mode: trigger_gesture  # glove, trigger_gesture
  trigger_gesture: pinch  # pinch, tripod, cylindrical（仅 trigger_gesture 模式生效）
  action_control_mode: joint  # joint, eef_delta

  # 统一复位姿态 JSON 路径。
  # 同时保存 arm + hand 的起始关节。
  # 文件不存在时会在第一次成功连到机器人/手套后自动创建。
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: pinch

run:
  # 录制频率，单位 Hz。
  fps: 30

  # 是否显示本地预览窗口。
  # 如果你环境里 OpenCV GUI 不可用，建议改成 false。
  display_data: false

  # 一次运行最多录多少个 episode。
  num_episodes: 1000

  # 单个 episode 最长时长，单位秒。
  episode_time_sec: 30

  # 保留的 reset 时间字段。
  reset_time_sec: 10

  # 任务名。
  # 自动数据集命名时会基于这个字段生成目录名。
  # 例如：
  # - pick and place -> pick_and_place_20260410
  single_task: pick up the camera from the yellow paper into black box

dataset:
  # 是否自动按"任务名 + 日期"命名数据集目录。
  # 可选值：
  # - true: 自动生成，例如 pick_and_place_20260410
  # - false: 使用下面手动填写的 repo_id
  auto_name_from_task_date: true

  # 自动命名时日期格式。
  # 常用值：
  # - "%Y%m%d"   -> 20260410
  # - "%Y-%m-%d" -> 2026-04-10
  date_format: "%Y%m%d"

  # 手动目录名。
  # 只有当 auto_name_from_task_date=false 时才会使用。
  repo_id: manual_dataset_name

  # 数据集根目录。
  # 最终路径会自动追加 with_tactile / without_tactile 子目录，由 robot.tactile_mode 决定：
  #   none -> ~/workspace/dataset/Robot/agi_arm_bot/without_tactile/<任务名_日期>
  #   其他 -> ~/workspace/dataset/Robot/agi_arm_bot/with_tactile/<任务名_日期>
  # 若手工把 root 末段写成 with_tactile / without_tactile，会被尊重不再追加；
  # 此时若与 tactile_mode 不一致会打 yellow 警告。
  root: ~/workspace/dataset/Robot/agi_arm_bot

  # 是否录相机视频。
  # - true: 录相机视频
  # - false: 只录 state / action
  video: true

  # 是否用 MCAP 存相机流。
  # 如果你想直接双击看视频，保持 false。
  mcap: false

  # 是否按 SSH 模式运行。
  is_ssh: false

  # 每路相机使用多少个图像写线程。
  num_image_writer_threads_per_camera: 4

  # 是否额外启用写入进程。
  # 0 表示不开额外进程。
  num_image_writer_processes: 0

  # 攒多少个 episode 再批量编码视频。
  # 1 表示每个 episode 录完就立刻编码。
  video_encoding_batch_size: 1
