# O10 单臂控制配置（左臂）
# 供脚本 `./scripts/o10/left_arm/control_o10_left.sh` 使用。
#
# 这份文件只负责"实时控制"，不负责录制数据。
# 虽然文件名里还叫 `left`，但现在可以直接靠 YAML 里的 handedness 切左右。
#
# 参数速查：
# 可选值速查（本文件字段）：
# - teleop.type: pico_leader_single_arm_agibot_o10；robot.type: pico_follower_single_arm_agibot_o10。
# - id: 任意日志名字符串；port: can0/can1 或实际 CAN 口。
# - handedness/controller_side: left, right；wrist_pose_source: auto, left, right。
# - vr_device: pico, pico_wrist；vr_pose_port/vr_ctrl_port/fps/width/height/device_id/canfd_id 为整数。
# - enable_hand/allow_camera_read_failures/display_data/use_depth: true, false。
# - hand_mode: glove, trigger_gesture；trigger_gesture/reset_gesture: pinch, tripod, cylindrical。
# - action_control_mode: joint, eef_delta；hand_action_mode 有该项时可选 dexterous_10d, gripper_1d。
# - channel_mode: multiChannel；channel_id: null 或整数，null 自动 left->0、right->1。
# - reset_poses_path/index_or_path/serial_number_or_name: 路径或设备名字符串。
# - camera.type: opencv, intelrealsense, realsense；color_mode: RGB/BGR 或 rgb/bgr。
# - fourcc: null 或 4 字符编码，常见 MJPG/YUYV/YUY2/I420/H264，是否可用取决于相机驱动。
# - rotation: NO_ROTATION, ROTATE_90, ROTATE_180, ROTATE_270。
# - teleop: Pico/VR 遥操作端配置，决定手柄、手腕位姿和手势如何生成 action。
# - teleop.type/id: 遥操作器类型和日志名；单臂 O10 固定使用 pico_leader_single_arm_agibot_o10。
# - teleop.handedness: 当前要控制的物理手/臂方向。
# - teleop.controller_side: 哪只 Pico 手柄负责开始、复位和按住使能；左臂这里使用右手柄。
# - teleop.vr_pose_port / vr_ctrl_port: Pico 位姿流和按键/扳机流的 UDP 端口。
# - teleop.vr_device: VR 数据来源；pico 表示使用 Pico 手柄/腕部数据。
# - teleop.wrist_pose_source: 机械臂读取哪个 wrist pose；left/right 强制指定，auto 自动选择。
# - teleop.enable_hand: 是否让遥操作端生成手部控制。
# - teleop.hand_mode: glove 使用手套 10D 数据；trigger_gesture 使用 Pico grip 映射预设手势。
# - teleop.trigger_gesture: trigger_gesture 模式下 grip 控制的预设手势。
# - teleop.action_control_mode: joint 输出关节目标；eef_delta 输出末端增量。
# - teleop.reset_poses_path / reset_gesture: reset 使用的 JSON 和手势。
# - robot: follower 机器人端配置，决定实际 CAN、手、相机和 action schema。
# - robot.type/id: 机器人类型和日志名；单臂 O10 固定使用 pico_follower_single_arm_agibot_o10。
# - robot.allow_camera_read_failures: true 时相机偶发读帧失败不中断控制。
# - robot.enable_hand: 是否连接并控制 O10 手；arm-only 时这里也要改 false。
# - robot.port: 机械臂 CAN 接口；左臂通常是 can0。
# - robot.handedness: follower 侧物理手/臂方向，需和实际 CAN/hand 通道一致。
# - robot.action_control_mode: 必须和 teleop 生成的 action schema 一致。
# - robot.channel_mode: O10 手 CANFD 通道模式，目前实际使用 multiChannel。
# - robot.device_id / canfd_id / channel_id: OmniHand 设备、适配器和通道编号。
# - robot.reset_poses_path / reset_gesture: 机器人 reset 使用的 JSON 和手势。
# - robot.cameras: control 可视化读取的相机配置；key 名会进入 observation/camera 名称。
# - camera.type: opencv 读普通 USB 相机；intelrealsense/realsense 读 RealSense。
# - camera.index_or_path / serial_number_or_name: OpenCV 设备路径或 RealSense 序列号。
# - camera.width/height/fps/fourcc/use_depth/color_mode/rotation: 图像尺寸、帧率、编码、深度、颜色顺序和旋转。
# - fps: 控制循环频率。
# - display_data: 是否打开图像/状态可视化。

teleop:
  # 遥操作器类型。
  # 当前 O10 左臂固定使用这个值。
  type: pico_leader_single_arm_agibot_o10

  # 遥操作器名字，仅用于日志显示。
  id: pico_left

  # 左臂模式下，左手柄控制左臂和左手；右手柄 A/B/RTr 负责开始、复位和按住使能。
  handedness: left
  controller_side: right

  # Pico wrist 位姿流端口。
  vr_pose_port: 8000

  # Pico wrist 控制按键 / 扳机流端口。
  vr_ctrl_port: 8001

  # VR 设备来源。
  # 当前这套只用：
  # - pico_wrist pico
  vr_device: pico

  # 机械臂控制位姿来源。
  # 可选值：
  # - auto: 自动选择当前有效的 wrist pose，推荐
  # - left: 强制只读左手腕
  # - right: 强制只读右手腕
  wrist_pose_source: left

  # 是否启用手控制。
  # 可选值：
  # - true: 手 + 臂一起控制
  # - false: 只控制机械臂
  enable_hand: true
  hand_mode: trigger_gesture  # glove, trigger_gesture
  trigger_gesture: pinch  # pinch, tripod, cylindrical（仅 trigger_gesture 模式生效）
  action_control_mode: joint  # joint, eef_delta

  # 统一复位姿态 JSON 路径。
  # 同时保存 arm + hand 的起始关节。
  # 文件不存在时会在第一次成功连到机器人/手套后自动创建。
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: pinch

robot:
  # 机器人类型。
  type: pico_follower_single_arm_agibot_o10
  allow_camera_read_failures: true

  # 是否启用 follower 手控制。
  # control 模式下不会自动继承 teleop.enable_hand，
  # 所以 arm-only 运行时这里也要显式关闭。
  enable_hand: true

  # 机械臂 CAN 口。
  port: can0

  # 机器人名字，仅用于日志显示。
  id: o10_left

  # 选择"哪只 follower 手/臂"接收控制。
  handedness: left
  action_control_mode: joint  # joint, eef_delta

  # O10 手通道模式。
  # 当前代码真正支持的只有：
  # - multiChannel
  channel_mode: multiChannel

  # OmniHand device_id。
  device_id: 1

  # CANFD 适配器编号。
  canfd_id: 0

  # O10 channel_id。
  # 保持 null 时会自动跟随 robot.handedness：
  # - left  -> 0
  # - right -> 1
  channel_id: null

  # 当前起始姿态会在 connect 时自动写回这里，后续所有 reset 都回到这组关节。
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: pinch

  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: NO_ROTATION

    left_wrist:
      type: intelrealsense
      serial_number_or_name: "260322276846"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      color_mode: rgb
      rotation: NO_ROTATION

# 控制循环频率，单位 Hz。
fps: 30

# 是否显示 control 阶段的可视化。
# 可选值：
# - true: 开启
# - false: 关闭
display_data: true
