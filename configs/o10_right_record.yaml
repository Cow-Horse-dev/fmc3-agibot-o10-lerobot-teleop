# O10 单臂录制配置
# 供脚本 `./scripts/record_o10_right.sh` 使用。
#
# 这份文件负责把数据录成 LeRobot 数据集格式。
# 当前已经配置成：
# - 数据保存在 ~/workspace/dataset/Robot/agi_arm_bot 下面
# - 目录名自动按“任务名 + 当天日期”生成
# 虽然文件名里还叫 `right`，但现在可以直接靠 YAML 里的 handedness 切左右。

robot:
  # 机器人类型。
  type: pico_follower_single_arm_agibot_o10

  # 机械臂 CAN 口。
  port: can0

  # 机器人名字，仅用于日志显示。
  id: o10_right

  # 选择“哪只 follower 手/臂”被录制并接收动作。
  handedness: right

  # O10 手通道模式。
  # 当前代码真正支持的只有：
  # - multiChannel
  channel_mode: multiChannel

  # OmniHand device_id。
  device_id: 1

  # CANFD 适配器编号。
  canfd_id: 0

  # O10 channel_id。
  # 保持 null 时会自动跟随 robot.handedness：
  # - left  -> 0
  # - right -> 1
  channel_id: null

  # 机器人侧全手复位姿态 JSON 路径。
  # 这个文件给 Y 键复位、启动复位、退出复位用。
  hand_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_right_hand_full_reset_pose.json

  # 录制时是否把 O10 触觉并进 observation.state。
  # - true: 额外录入 130 维触觉观测
  # - false: 不录触觉，只录当前已有的臂/手/位姿/相机
  include_tactile_observation: false

  cameras:
    right:
      # Record / infer 配置里 RealSense 类型写 `realsense`。
      type: realsense
      serial_number_or_name: "260322273018"
      width: 640
      height: 480
      fps: 30
      # true 时会额外生成一条 LeRobot 图像流：
      # - observation.images.right_depth
      # 这里录入的是 RealSense 真深度，只是编码成 3 通道图像以兼容 LeRobot。
      use_depth: false

      # 可选值：RGB / BGR
      color_mode: RGB

      # 可选值：
      # - NO_ROTATION
      # - ROTATE_90
      # - ROTATE_180
      # - ROTATE_270
      rotation: NO_ROTATION

    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 1280
      height: 720
      fps: 30
      rotation: NO_ROTATION

teleop:
  # 遥操作器类型。
  type: pico_leader_single_arm_agibot_o10

  # 遥操作器名字，仅用于日志显示。
  id: pico_right

  # 选择“哪只 leader 手”来做遥操作录制。
  # 这决定 glove 数据按左手还是右手解释。
  handedness: right

  # Pico wrist 位姿流端口。
  vr_pose_port: 8000

  # Pico wrist 控制按键 / 扳机流端口。
  vr_ctrl_port: 8001

  # VR 设备来源。
  vr_device: pico_wrist

  # 位姿控制来源。
  # 可选值：auto / left / right
  wrist_pose_source: auto

  # 是否启用手控制。
  # - true: 手 + 臂一起录
  # - false: 只录机械臂
  enable_hand: true

  # 全手控制复位手型 JSON 路径。
  # 这个文件给 full_hand 模式和 Y 键复位用。
  # 如果改成 left，建议一起改成：
  #   ~/workspace/arm-hand-teleop/configs/o10_left_hand_full_reset_pose.json
  # 文件不存在时会在第一次成功连到手套后自动创建。
  hand_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_right_hand_full_reset_pose.json

  # 固定抓取手型骨架 JSON 路径。
  # 这个文件只给 grasp_preset 模式用。
  # 它决定：
  # - 未激活手指锁定在哪个姿态
  # - 拇指横向姿态基准是什么
  # 如果改成 left，建议一起改成：
  #   ~/workspace/arm-hand-teleop/configs/o10_left_hand_grasp_preset_pose.json
  hand_grasp_preset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_right_hand_grasp_preset_pose.json

  # 手控制模式。
  # 可选值：
  # - full_hand: 全手按手套原始数据控制
  # - grasp_preset: 只让 preset 指定的抓取关节参与控制，其余手指固定在 grasp preset 骨架
  #
  # 推荐录“夹取摄像头”这种精细抓取时使用 `grasp_preset`。
  # 这时拇指姿态不会跟着手套横向外翻，而是主要由 grasp preset 骨架决定，
  # 抓取时只保留“往里扣”的闭合动作，更像夹子。
  hand_control_mode: full_hand

  # 固定抓取手型。
  # 只有 hand_control_mode=grasp_preset 时才生效。
  # 可选值：
  # - pinch_index: 拇指 + 食指。只放开 thumb_cm_pitch / index_mp_pitch，
  #   thumb_cm_roll、thumb_cm_yaw、index_mp_yaw 会锁在 grasp preset 骨架。
  # - pinch_middle: 拇指 + 中指。只放开 thumb_cm_pitch / middle_mp_pitch，
  #   拇指横向姿态锁在 grasp preset 骨架。
  # - tripod: 拇指 + 食指 + 中指。只放开 thumb_cm_pitch / index_mp_pitch /
  #   middle_mp_pitch，其余手指保持 grasp preset 骨架。
  #
  # 用法建议：
  # 1. 先把 hand_grasp_preset_joints_path 这份 JSON 调成你想要的“竖直拇指”抓取骨架。
  # 2. 再把 hand_control_mode 改成 grasp_preset。
  # 3. 最后选 hand_grasp_preset。
  hand_grasp_preset: pinch_index

run:
  # 录制频率，单位 Hz。
  fps: 30

  # 是否显示本地预览窗口。
  # 如果你环境里 OpenCV GUI 不可用，建议改成 false。
  display_data: false

  # 一次运行最多录多少个 episode。
  num_episodes: 10

  # 单个 episode 最长时长，单位秒。
  episode_time_sec: 30

  # 保留的 reset 时间字段。
  reset_time_sec: 10

  # 任务名。
  # 自动数据集命名时会基于这个字段生成目录名。
  # 例如：
  # - pick and place -> pick_and_place_20260410
  single_task: pick and place

dataset:
  # 是否自动按“任务名 + 日期”命名数据集目录。
  # 可选值：
  # - true: 自动生成，例如 pick_and_place_20260410
  # - false: 使用下面手动填写的 repo_id
  auto_name_from_task_date: true

  # 自动命名时日期格式。
  # 常用值：
  # - "%Y%m%d"   -> 20260410
  # - "%Y-%m-%d" -> 2026-04-10
  date_format: "%Y%m%d"

  # 手动目录名。
  # 只有当 auto_name_from_task_date=false 时才会使用。
  repo_id: manual_dataset_name

  # 数据集根目录。
  # 最终实际路径会是：
  #   ~/workspace/dataset/Robot/agi_arm_bot/<任务名_日期>
  root: ~/workspace/dataset/Robot/agi_arm_bot

  # 是否录相机视频。
  # - true: 录相机
  # - false: 只录 state / action
  video: true

  # 是否用 MCAP 存相机流。
  # 如果你想直接双击看视频，保持 false。
  mcap: false

  # 是否按 SSH 模式运行。
  is_ssh: false

  # 每路相机使用多少个图像写线程。
  num_image_writer_threads_per_camera: 4

  # 是否额外启用写入进程。
  # 0 表示不开额外进程。
  num_image_writer_processes: 0

  # 攒多少个 episode 再批量编码视频。
  # 1 表示每个 episode 录完就立刻编码。
  video_encoding_batch_size: 1
