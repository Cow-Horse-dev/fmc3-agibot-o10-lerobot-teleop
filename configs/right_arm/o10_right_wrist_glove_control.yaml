# O10 右臂腕带 + 宇叠手套控制配置
# 供明天 demo 使用：右臂位姿来自 Pico wrist，右手手指来自 UDE glove。

teleop:
  type: pico_leader_single_arm_agibot_o10
  id: pico_right_wrist_glove
  handedness: right
  controller_side: left
  vr_pose_port: 8000
  vr_ctrl_port: 8001
  vr_device: pico_wrist
  wrist_pose_source: right
  enable_hand: true
  hand_mode: glove
  action_control_mode: joint
  hand_action_mode: dexterous_10d
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: cylindrical

robot:
  type: pico_follower_single_arm_agibot_o10
  allow_camera_read_failures: true
  port: can1
  id: o10_right_wrist_glove
  handedness: right
  action_control_mode: joint
  hand_action_mode: dexterous_10d
  channel_mode: multiChannel
  device_id: 1
  canfd_id: 0
  channel_id: null
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: cylindrical
  camera_config_path: configs/cameras/o10_cameras.yaml
  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: h264
      rotation: ROTATE_180
    right_wrist: right_wrist

fps: 30
display_data: true
