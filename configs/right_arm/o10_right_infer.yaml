# O10 单臂推理配置（右臂）
# 供脚本 `./scripts/o10/right_arm/infer_o10_right.sh` 使用。
#
# - infer 只读 `infer:` 和 `robot:` 两个块
# - `model_path` 必须指向本机真实存在的模型目录
# - `robot.include_eef_pose` / `tactile_mode` 必须与训练数据集一致
# - 不同已训练模型的专用推理配置放在 `configs/right_arm/policies/`

infer:
  policy: diffusion  # act / diffusion / pi0 / pi05 / smolvla / groot
  task_description: pick up blue camera into black box
  model_path: ~/workspace/mymodels/agi_arm_bot/diffusion_pick_up_blue_camera_into_black_box/checkpoints/last/pretrained_model
  save_data: false
  display_data: true
  async_infer: false
  num_episodes: 100
  episode_time_sec: 100
  fps: 15
  device: cuda  # cuda / cpu
  server_address: localhost:8080  # 仅 async_infer: true 时用
  save_path: null

robot:
  type: pico_follower_single_arm_agibot_o10
  id: o10_right
  port: can1
  handedness: right
  enable_hand: true
  include_eef_pose: false   # 与 o10_right_record.yaml 保持一致
  tactile_mode: "none"
  channel_mode: multiChannel
  device_id: 1
  canfd_id: 0
  channel_id: null  # null 自动跟随 handedness: left->0, right->1
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: pinch

  cameras:
    right:                         # 单右臂录制时腕相机 key 就叫 right，推理要一致
      type: realsense
      serial_number_or_name: "260322273018"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      color_mode: RGB
      rotation: NO_ROTATION

    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: NO_ROTATION
