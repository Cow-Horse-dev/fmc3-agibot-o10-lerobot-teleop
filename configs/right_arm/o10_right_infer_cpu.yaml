# O10 单臂 CPU 推理配置
# 供脚本 `./scripts/o10/right_arm/infer_o10_right_cpu.sh` 使用。
# 和 `o10_right_infer.yaml` 一致，区别只在 device: cpu。

infer:
  policy: act
  task_description: pick and place
  model_path: ~/workspace/mymodel/agi_arm_bot
  save_data: false
  async_infer: false
  num_episodes: 1
  episode_time_sec: 30
  fps: 30
  device: cpu
  server_address: localhost:8080  # 仅 async_infer: true 时用
  save_path: null

robot:
  type: pico_follower_single_arm_agibot_o10
  id: o10_right
  port: can1
  handedness: right
  enable_hand: true
  include_eef_pose: false   # 与 o10_right_record.yaml 保持一致
  tactile_mode: "none"
  channel_mode: multiChannel
  device_id: 1
  canfd_id: 0
  channel_id: null
  reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
  reset_gesture: pinch

  cameras:
    right:
      type: realsense
      serial_number_or_name: "260322273018"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      color_mode: RGB
      rotation: NO_ROTATION

    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: NO_ROTATION
