# O10 双臂录制配置
# 供脚本 `./scripts/o10/dual_arm/record_o10_dual.sh` 使用。
#
# 参数速查：
# 可选值速查（本文件字段）：
# - teleop.type: pico_leader_dual_arm_agibot_o10；robot.type: pico_follower_dual_arm_agibot_o10。
# - id/single_task/repo_id: 普通字符串；left/right.port: can0/can1 或实际 CAN 口。
# - handedness: left, right；wrist_pose_source: auto, left, right；vr_device: pico, pico_wrist。
# - enable_hand/include_eef_pose/allow_camera_read_failures/display_data/auto_name_from_task_date/video/mcap/is_ssh/use_depth: true, false。
# - arm_trigger_mode: split, left, right, both；hand_mode: glove, trigger_gesture。
# - trigger_gesture/gripper_gesture/reset_gesture: pinch, tripod, cylindrical。
# - action_control_mode: joint, eef_delta；hand_action_mode: dexterous_10d, gripper_1d。
# - tactile_mode: none, 130d；channel_mode: multiChannel。
# - channel_id: null 或整数，null 自动 left->0、right->1。
# - reset_poses_path/root/index_or_path/serial_number_or_name: 路径或设备名字符串。
# - camera.type: opencv, intelrealsense, realsense；color_mode: RGB/BGR 或 rgb/bgr。
# - fourcc: null 或 4 字符编码，常见 MJPG/YUYV/YUY2/I420/H264，是否可用取决于相机驱动。
# - rotation: NO_ROTATION, ROTATE_90, ROTATE_180, ROTATE_270。
# - vr_pose_port/vr_ctrl_port/fps/width/height/device_id/canfd_id/num_episodes/*_time_sec/写入线程和批量大小: 整数。
# - date_format: Python strftime 格式，例如 "%Y%m%d" 或 "%Y-%m-%d"。
# - teleop: 录制时的遥操作端配置，决定 Pico 输入如何变成 action。
# - teleop.type/id: 遥操作器类型和日志名；双臂 O10 固定使用 pico_leader_dual_arm_agibot_o10。
# - teleop.vr_pose_port / vr_ctrl_port: Pico 位姿流和按键/扳机流的 UDP 端口。
# - teleop.vr_device: VR 数据来源；pico 表示使用 Pico 手柄/腕部数据。
# - teleop.enable_hand: 是否把手部动作写入 action。
# - teleop.arm_trigger_mode: 控臂门控模式；left/right/both/split 控制 LTr/RTr 如何使能左右臂。
# - teleop.hand_mode: glove 使用手套 10D 数据；trigger_gesture 使用 Pico grip 映射预设手势。
# - teleop.trigger_gesture: 默认手势；每侧 left/right 可单独覆盖。
# - teleop.action_control_mode: joint 录关节目标；eef_delta 录末端增量。
# - teleop.hand_action_mode: dexterous_10d 录 10D 手关节；gripper_1d 录 gripper.pos。
# - teleop.left/right.handedness: 该侧物理手/臂的左右属性。
# - teleop.left/right.wrist_pose_source: 该侧机械臂读取哪个 Pico wrist pose。
# - teleop.left/right.trigger_gesture: trigger_gesture 模式下该侧 grip 控制的预设手势。
# - teleop.left/right.gripper_gesture: gripper_1d 的 0..1 值投影/回放到哪种手势。
# - teleop.left/right.reset_poses_path / reset_gesture: 复位姿态 JSON 和复位手势。
# - robot: 实际被录制和被控制的 follower 机器人端配置。
# - robot.type/id: 机器人类型和日志名；双臂 O10 固定使用 pico_follower_dual_arm_agibot_o10。
# - robot.enable_hand: 是否连接并录制 O10 手。
# - robot.include_eef_pose: 是否把末端位姿额外加入 observation.state；必须与训练/推理一致。
# - robot.action_control_mode / hand_action_mode: 决定 dataset action schema，回放和推理必须一致。
# - robot.allow_camera_read_failures: true 时相机偶发读帧失败不中断录制。
# - robot.tactile_mode: 触觉特征维度；none/130d 必须与训练一致。
# - robot.left/right.port: 左右机械臂 CAN 接口，通常 left=can0、right=can1。
# - robot.left/right.channel_mode: O10 手 CANFD 通道模式，目前实际使用 multiChannel。
# - robot.left/right.device_id / canfd_id / channel_id: OmniHand 设备、适配器和通道编号。
# - robot.left/right.gripper_gesture / reset_gesture: gripper.pos 投影和 reset 时用的手势。
# - robot.cameras: 录入数据集的相机配置；key 名会成为 observation.images.<key>。
# - camera.type: opencv 读普通 USB 相机；intelrealsense/realsense 读 RealSense。
# - camera.index_or_path / serial_number_or_name: OpenCV 设备路径或 RealSense 序列号。
# - camera.width/height/fps/fourcc/use_depth/color_mode/rotation: 图像尺寸、帧率、编码、深度、颜色顺序和旋转。
# - run.fps: 录制主循环频率。
# - run.display_data: 是否打开本地预览窗口。
# - run.num_episodes / episode_time_sec / reset_time_sec: episode 数、单条时长和 reset 时长字段。
# - run.single_task: 任务文本；也会用于自动生成数据集目录名。
# - dataset.auto_name_from_task_date / date_format: 是否按任务名+日期自动命名数据集目录。
# - dataset.repo_id: 手动数据集目录名；auto_name_from_task_date=false 时使用。
# - dataset.root: 数据集根目录；最终数据会写到 root/repo_id 或 root/自动目录名。
# - dataset.video / mcap: 相机保存为视频还是 MCAP。
# - dataset.is_ssh: SSH/无桌面环境提示开关。
# - dataset.num_image_writer_threads_per_camera / num_image_writer_processes: 图像写入并发数。
# - dataset.video_encoding_batch_size: 每多少个 episode 批量编码一次视频。

teleop:
  type: pico_leader_dual_arm_agibot_o10  # 可选: pico_leader_dual_arm_agibot_o10
  id: pico_dual  # 遥操作端 id
  vr_pose_port: 8000  # VR 姿态端口
  vr_ctrl_port: 8001  # VR 控制端口
  vr_device: pico  # 可选: pico, pico_wrist
  enable_hand: true  # 可选: true, false
  # 双臂控臂“使能扳机”模式，不是选择只控制哪一只臂：
  # - left:  按住左扳机 LTr 时，双臂都允许跟随
  # - right: 按住右扳机 RTr 时，双臂都允许跟随
  # - both:  同时按住 LTr + RTr 时，双臂都允许跟随
  # - split: 左臂看 LTr，右臂看 RTr
  arm_trigger_mode: left  # 可选: split, left, right, both
  hand_mode: trigger_gesture  # 可选: glove, trigger_gesture
  trigger_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight（仅 trigger_gesture 模式生效）
  action_control_mode: joint  # 可选: joint, eef_delta
  hand_action_mode: gripper_1d  # 可选: dexterous_10d, gripper_1d
  left:
    handedness: left  # 可选: left, right
    wrist_pose_source: left  # 可选: auto, left, right
    trigger_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
    gripper_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json  # reset 姿态 JSON
    reset_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
  right:
    handedness: right  # 可选: left, right
    wrist_pose_source: right  # 可选: auto, left, right
    trigger_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
    gripper_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json  # reset 姿态 JSON
    reset_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight

robot:
  type: pico_follower_dual_arm_agibot_o10  # 可选: pico_follower_dual_arm_agibot_o10
  id: o10_dual  # 机器人端 id
  enable_hand: true  # 可选: true, false
  include_eef_pose: false  # 可选: true, false
  action_control_mode: joint  # 可选: joint, eef_delta
  hand_action_mode: gripper_1d  # 可选: dexterous_10d, gripper_1d
  allow_camera_read_failures: true  # 可选: true, false
  tactile_mode: "none"  # 可选: none, 130d；也决定数据集 root 子目录 (none -> without_tactile, 其他 -> with_tactile)
  left:
    port: can0  # CAN 口
    handedness: left  # 可选: left, right
    channel_mode: multiChannel  # 可选: multiChannel
    device_id: 1  # O10 设备 id
    canfd_id: 0  # CANFD id
    channel_id: null  # 可选: null 或整数；null 自动 left->0, right->1
    gripper_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json  # reset 姿态 JSON
    reset_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
  right:
    port: can1  # CAN 口
    handedness: right  # 可选: left, right
    channel_mode: multiChannel  # 可选: multiChannel
    device_id: 1  # O10 设备 id
    canfd_id: 0  # CANFD id
    channel_id: null  # 可选: null 或整数；null 自动 left->0, right->1
    gripper_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json  # reset 姿态 JSON
    reset_gesture: cylindrical_straight  # 可选: pinch, tripod, cylindrical, cylindrical_straight
  camera_config_path: configs/cameras/o10_cameras.yaml
  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: ROTATE_180
    left_wrist: left_wrist
    right_wrist: right_wrist

run:
  # 录制频率，单位 Hz。
  fps: 30  # 录制频率，单位 Hz

  # 是否显示本地预览窗口。
  # 双臂 + 三路相机录制时本地显示负载较高，默认关闭以保证空格开始后稳定进入录制循环。
  display_data: false  # 可选: true, false

  # 一次运行最多录多少个 episode。
  # 测试采集默认只录 1 条，避免自动进入下一条时打断写盘。
  num_episodes: 1000  # 最多录制 episode 数

  # 单个 episode 最长时长，单位秒。
  episode_time_sec: 60  # 单个 episode 最长时长，单位秒

  # 保留的 reset 时间字段。
  reset_time_sec: 10  # reset 时间字段，单位秒

  # 任务名。
  single_task: dual arm collaborative express parcel sorting  # 任务描述

dataset:
  # 是否自动按"任务名 + 日期"命名数据集目录。
  auto_name_from_task_date: true  # 可选: true, false

  # 自动命名时日期格式。
  date_format: "%Y%m%d"  # 自动命名日期格式

  # 手动目录名。
  repo_id: manual_dataset_name  # 手动数据集目录名

  # 数据集根目录。
  # 最终路径会自动追加 with_tactile / without_tactile 子目录，由 robot.tactile_mode 决定：
  #   none -> ~/workspace/dataset/Robot/agi_arm_bot/without_tactile/<任务名_日期>
  #   其他 -> ~/workspace/dataset/Robot/agi_arm_bot/with_tactile/<任务名_日期>
  # 若手工把 root 末段写成 with_tactile / without_tactile，会被尊重不再追加；
  # 此时若与 tactile_mode 不一致会打 yellow 警告。
  root: ~/workspace/dataset/Robot/agi_arm_bot  # 数据集根目录

  # 是否录相机视频。
  video: true  # 可选: true, false

  # 是否用 MCAP 存相机流。
  mcap: false  # 可选: true, false

  # 是否按 SSH 模式运行。
  is_ssh: false  # 可选: true, false

  # 每路相机使用多少个图像写线程。
  num_image_writer_threads_per_camera: 4  # 每路相机图像写线程数

  # 是否额外启用写入进程。
  num_image_writer_processes: 0  # 图像写进程数

  # 攒多少个 episode 再批量编码视频。
  video_encoding_batch_size: 1  # 视频批量编码 episode 数
