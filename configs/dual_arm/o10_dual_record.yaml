# O10 双臂录制配置
# 供脚本 `./scripts/record_o10_dual.sh` 使用。

teleop:
  type: pico_leader_dual_arm_agibot_o10
  id: pico_dual
  vr_pose_port: 8000
  vr_ctrl_port: 8001
  vr_device: pico_wrist
  enable_hand: true
  left:
    handedness: left
    wrist_pose_source: left
    arm_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_left_reset_pose.json
    hand_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_left_reset_pose.json
  right:
    handedness: right
    wrist_pose_source: right
    arm_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_right_reset_pose.json
    hand_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_right_reset_pose.json

robot:
  type: pico_follower_dual_arm_agibot_o10
  id: o10_dual
  left:
    port: can1
    handedness: left
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    arm_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_left_reset_pose.json
    hand_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_left_reset_pose.json
  right:
    port: can0
    handedness: right
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    arm_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_right_reset_pose.json
    hand_reset_joints_path: ~/workspace/arm-hand-teleop/configs/o10_right_reset_pose.json
  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      rotation: NO_ROTATION

run:
  # 录制频率，单位 Hz。
  fps: 30

  # 是否显示本地预览窗口。
  display_data: false

  # 一次运行最多录多少个 episode。
  num_episodes: 1000

  # 单个 episode 最长时长，单位秒。
  episode_time_sec: 30

  # 保留的 reset 时间字段。
  reset_time_sec: 10

  # 任务名。
  single_task: pick up the camera from the yellow paper into black box

dataset:
  # 是否自动按"任务名 + 日期"命名数据集目录。
  auto_name_from_task_date: true

  # 自动命名时日期格式。
  date_format: "%Y%m%d"

  # 手动目录名。
  repo_id: manual_dataset_name

  # 数据集根目录。
  root: ~/workspace/dataset/Robot/agi_arm_bot

  # 是否录相机视频。
  video: true

  # 是否用 MCAP 存相机流。
  mcap: false

  # 是否按 SSH 模式运行。
  is_ssh: false

  # 每路相机使用多少个图像写线程。
  num_image_writer_threads_per_camera: 4

  # 是否额外启用写入进程。
  num_image_writer_processes: 0

  # 攒多少个 episode 再批量编码视频。
  video_encoding_batch_size: 1
