# O10 双臂录制配置
# 供脚本 `./scripts/o10/dual_arm/record_o10_dual.sh` 使用。

teleop:
  type: pico_leader_dual_arm_agibot_o10
  id: pico_dual
  vr_pose_port: 8000
  vr_ctrl_port: 8001
  vr_device: pico
  enable_hand: true
  # 双臂控臂“使能扳机”模式，不是选择只控制哪一只臂：
  # - left:  按住左扳机 LTr 时，双臂都允许跟随
  # - right: 按住右扳机 RTr 时，双臂都允许跟随
  # - both:  同时按住 LTr + RTr 时，双臂都允许跟随
  # - split: 左臂看 LTr，右臂看 RTr
  arm_trigger_mode: left
  hand_mode: trigger_gesture  # glove, trigger_gesture
  trigger_gesture: tripod  # pinch, tripod（仅 trigger_gesture 模式生效）
  action_control_mode: joint  # joint, eef_delta
  hand_action_mode: gripper_1d  # dexterous_10d, gripper_1d
  left:
    handedness: left
    wrist_pose_source: left
    trigger_gesture: tripod
    gripper_gesture: tripod
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: tripod
  right:
    handedness: right
    wrist_pose_source: right
    trigger_gesture: pinch
    gripper_gesture: pinch
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: pinch

robot:
  type: pico_follower_dual_arm_agibot_o10
  id: o10_dual
  enable_hand: true  # true, false
  include_eef_pose: false
  action_control_mode: joint  # joint, eef_delta
  hand_action_mode: gripper_1d  # dexterous_10d, gripper_1d
  tactile_mode: "7d"  # none, 7d, 80d, 130d
  left:
    port: can0
    handedness: left
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    gripper_gesture: tripod
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: tripod
  right:
    port: can1
    handedness: right
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    gripper_gesture: pinch
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: pinch
  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: NO_ROTATION
    left_wrist:
      type: intelrealsense
      serial_number_or_name: "260322276846"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      color_mode: rgb
      rotation: NO_ROTATION
    right_wrist:
      type: intelrealsense
      serial_number_or_name: "260322273018"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      color_mode: rgb
      rotation: NO_ROTATION

run:
  # 录制频率，单位 Hz。
  fps: 30

  # 是否显示本地预览窗口。
  # 双臂 + 三路相机录制时本地显示负载较高，默认关闭以保证空格开始后稳定进入录制循环。
  display_data: false

  # 一次运行最多录多少个 episode。
  # 测试采集默认只录 1 条，避免自动进入下一条时打断写盘。
  num_episodes: 1000

  # 单个 episode 最长时长，单位秒。
  episode_time_sec: 60

  # 保留的 reset 时间字段。
  reset_time_sec: 10

  # 任务名。
  single_task: right hand picks up the camera, left hand picks up the pen, then left hand uses the pen to touch

dataset:
  # 是否自动按"任务名 + 日期"命名数据集目录。
  auto_name_from_task_date: true

  # 自动命名时日期格式。
  date_format: "%Y%m%d"

  # 手动目录名。
  repo_id: manual_dataset_name

  # 数据集根目录。
  root: ~/workspace/dataset/Robot/agi_arm_bot

  # 是否录相机视频。
  video: true

  # 是否用 MCAP 存相机流。
  mcap: false

  # 是否按 SSH 模式运行。
  is_ssh: false

  # 每路相机使用多少个图像写线程。
  num_image_writer_threads_per_camera: 4

  # 是否额外启用写入进程。
  num_image_writer_processes: 0

  # 攒多少个 episode 再批量编码视频。
  video_encoding_batch_size: 1
