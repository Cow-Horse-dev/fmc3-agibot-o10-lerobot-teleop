# O10 双臂推理配置
# 供脚本 `./scripts/o10/dual_arm/infer_o10_dual.sh` 使用。
#
# - infer 只读 `infer:` 和 `robot:` 两个块，不读 teleop
# - `model_path` 必须指向本机真实存在的模型目录
# - `robot.include_eef_pose` / `tactile_mode` 必须与训练数据集一致，否则
#   observation.state 维度/语义都会跟模型对不上
#
# 参数速查：
# 可选值速查（本文件字段）：
# - infer.policy: act, diffusion, pi0, pi05, smolvla, groot；infer.device: cuda, cpu。
# - infer.save_data/display_data/async_infer 和 robot.enable_hand/include_eef_pose/use_depth: true, false。
# - infer.model_path/save_path/reset_poses_path/index_or_path: null 或路径字符串；server_address: host:port。
# - infer.task_description/id/serial_number_or_name: 普通字符串。
# - infer.num_episodes/episode_time_sec/fps 和 camera width/height/fps/device_id/canfd_id: 整数。
# - robot.type: pico_follower_dual_arm_agibot_o10；left/right.port: can0/can1 或实际 CAN 口。
# - handedness: left, right；action_control_mode: joint, eef_delta；hand_action_mode: dexterous_10d, gripper_1d。
# - tactile_mode: none, 130d；channel_mode: multiChannel。
# - channel_id: null 或整数，null 自动 left->0、right->1。
# - gripper_gesture/reset_gesture: pinch, tripod, cylindrical。
# - camera.type: opencv, intelrealsense, realsense；color_mode: RGB/BGR 或 rgb/bgr。
# - fourcc: null 或 4 字符编码，常见 MJPG/YUYV/YUY2/I420/H264，是否可用取决于相机驱动。
# - rotation: NO_ROTATION, ROTATE_90, ROTATE_180, ROTATE_270。
# - infer.policy: 策略类型；act/diffusion/pi0/pi05/smolvla/groot。
# - infer.task_description: VLA/策略任务文本，需和训练任务语义一致。
# - infer.model_path: 本机模型目录或 checkpoint 目录。
# - infer.save_data: 是否把推理过程另存为数据集。
# - infer.display_data: 是否显示推理时相机/状态可视化。
# - infer.async_infer: true 时通过策略服务器异步推理；false 时本进程直接跑模型。
# - infer.num_episodes / episode_time_sec: 推理执行轮数和单轮最长时长。
# - infer.fps: 推理控制频率，通常低于录制/control fps。
# - infer.device: cuda 或 cpu。
# - infer.server_address: async_infer=true 时连接的策略服务器地址。
# - infer.save_path: save_data=true 时的数据保存路径；null 使用默认路径。
# - robot: 推理时连接的 follower 机器人配置。
# - robot.type/id: 机器人类型和日志名；双臂 O10 固定使用 pico_follower_dual_arm_agibot_o10。
# - robot.enable_hand: 是否执行模型输出里的手部动作。
# - robot.include_eef_pose: observation.state 是否包含末端位姿，必须与训练数据一致。
# - robot.action_control_mode / hand_action_mode: 必须与训练数据集 action schema 一致。
# - robot.tactile_mode: 触觉特征维度；none/130d 必须与训练一致。
# - robot.left/right.port: 左右机械臂 CAN 接口，通常 left=can0、right=can1。
# - robot.left/right.channel_mode: O10 手 CANFD 通道模式，目前实际使用 multiChannel。
# - robot.left/right.device_id / canfd_id / channel_id: OmniHand 设备、适配器和通道编号。
# - robot.left/right.gripper_gesture: 模型输出 gripper.pos 回放到哪种手势，必须与训练/录制一致。
# - robot.left/right.reset_poses_path / reset_gesture: reset 使用的 JSON 和手势。
# - robot.cameras: 推理 observation 图像来源；key 名、数量和训练数据必须一致。
# - camera.type/index_or_path/serial_number_or_name/width/height/fps/fourcc/use_depth/color_mode/rotation: 相机类型、设备、尺寸、帧率、编码、深度、颜色顺序和旋转。

infer:
  policy: pi05  # 可选: act, diffusion, pi0, pi05, smolvla, groot
  task_description: right hand picks up the camera, left hand picks up the pen, then left hand uses the pen to touch  # VLA/策略任务描述
  model_path: ~/workspace/mymodels/qiuzhi_agibot/camera_pen_touch_clean_del_52_376/pi0/pi05_camera_pen_touch_clean_del_52_376_selected/120000/pretrained_model  # 本机模型目录
  save_data: false  # 可选: true, false
  display_data: true  # 可选: true, false
  async_infer: false  # 可选: true, false
  num_episodes: 100000  # 推理 episode 数；大数值用于持续循环执行
  episode_time_sec: 3600  # 单个 episode 最长时长，单位秒
  fps: 15  # 推理频率，单位 Hz
  device: cuda  # 可选: cuda, cpu
  server_address: localhost:8080  # 仅 async_infer: true 时用
  save_path: null  # 可选: null 或数据保存目录

robot:
  type: pico_follower_dual_arm_agibot_o10  # 可选: pico_follower_dual_arm_agibot_o10
  id: o10_dual  # 机器人端 id
  enable_hand: true  # 可选: true, false
  include_eef_pose: false  # 可选: true, false；与 o10_dual_record.yaml 保持一致
  action_control_mode: joint  # 可选: joint, eef_delta；与训练数据集 action schema 保持一致
  hand_action_mode: gripper_1d  # 可选: dexterous_10d, gripper_1d；与 o10_dual_record.yaml 保持一致
  tactile_mode: "none"  # 可选: none, 130d；与 20260427 gripper_1d 训练数据集一致
  left:
    port: can0  # CAN 口
    handedness: left  # 可选: left, right
    channel_mode: multiChannel  # 可选: multiChannel
    device_id: 1  # O10 设备 id
    canfd_id: 0  # CANFD id
    channel_id: null  # 可选: null 或整数；null 自动 left->0, right->1
    gripper_gesture: tripod  # 可选: pinch, tripod, cylindrical；与录制一致
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json  # reset 姿态 JSON
    reset_gesture: tripod  # 可选: pinch, tripod, cylindrical
  right:
    port: can1  # CAN 口
    handedness: right  # 可选: left, right
    channel_mode: multiChannel  # 可选: multiChannel
    device_id: 1  # O10 设备 id
    canfd_id: 0  # CANFD id
    channel_id: null  # 可选: null 或整数；null 自动 left->0, right->1
    gripper_gesture: pinch  # 可选: pinch, tripod, cylindrical；与录制一致
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json  # reset 姿态 JSON
    reset_gesture: pinch  # 可选: pinch, tripod, cylindrical
  camera_config_path: configs/cameras/o10_cameras.yaml
  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: ROTATE_180
    left_wrist: left_wrist
    right_wrist: right_wrist
