# O10 双臂推理配置
# 供脚本 `./scripts/o10/dual_arm/infer_o10_dual.sh` 使用。
#
# - infer 只读 `infer:` 和 `robot:` 两个块，不读 teleop
# - `model_path` 必须指向本机真实存在的模型目录
# - `robot.include_eef_pose` / `tactile_mode` 必须与训练数据集一致，否则
#   observation.state 维度/语义都会跟模型对不上

infer:
  policy: diffusion
  task_description: right hand picks up the camera, left hand picks up the pen, then left hand uses the pen to touch
  model_path: ~/workspace/mymodels/agi_arm_bot/diffusion_pick_up_blue_camera_into_black_box/checkpoints/last/pretrained_model
  save_data: false
  display_data: true
  async_infer: false
  num_episodes: 100
  episode_time_sec: 100
  fps: 30
  device: cuda
  server_address: localhost:8080  # 仅 async_infer: true 时用
  save_path: null

robot:
  type: pico_follower_dual_arm_agibot_o10
  id: o10_dual
  enable_hand: true
  include_eef_pose: false   # 与 o10_dual_record.yaml 保持一致；gripper_1d state 不包含末端 pose
  action_control_mode: joint # 与训练数据集 action schema 保持一致：joint, eef_delta
  hand_action_mode: gripper_1d  # 与 o10_dual_record.yaml 保持一致：dexterous_10d, gripper_1d
  tactile_mode: "7d"        # 与 o10_dual_record.yaml 保持一致
  left:
    port: can0
    handedness: left
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    gripper_gesture: tripod  # 与录制一致
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: tripod
  right:
    port: can1
    handedness: right
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    gripper_gesture: pinch  # 与录制一致
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: pinch
  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: NO_ROTATION
    left_wrist:
      type: intelrealsense
      serial_number_or_name: "260322276846"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      color_mode: rgb
      rotation: NO_ROTATION
    right_wrist:
      type: intelrealsense
      serial_number_or_name: "260322273018"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      color_mode: rgb
      rotation: NO_ROTATION
