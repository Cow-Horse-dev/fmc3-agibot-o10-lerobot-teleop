# O10 dual-arm PI0.5 full-finetune async inference config.
# The model is still training; override infer.model_path from the launch script
# with ARM_HAND_TELEOP_DUAL_PI05_FULLFT_MODEL when the checkpoint is ready.

infer:
  policy: pi05
  task_description: dual arm collaborative express parcel sorting
  model_path: /home/phl/workspace/mymodels/agi_arm_bot/pi05_o10_dual_arm_collaborative_express_parcel_sorting_fullft/pretrained_model
  save_data: false
  display_data: true
  async_infer: true
  num_episodes: 100000
  episode_time_sec: 3600
  fps: 30
  device: cuda
  server_address: localhost:8080
  save_path: null

robot:
  type: pico_follower_dual_arm_agibot_o10
  id: o10_dual
  enable_hand: true
  include_eef_pose: false
  action_control_mode: joint
  hand_action_mode: gripper_1d
  allow_camera_read_failures: true
  camera_read_timeout_ms: 35
  tactile_mode: "none"
  left:
    port: can0
    handedness: left
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    gripper_gesture: cylindrical_straight
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: cylindrical_straight
  right:
    port: can1
    handedness: right
    channel_mode: multiChannel
    device_id: 1
    canfd_id: 0
    channel_id: null
    gripper_gesture: cylindrical_straight
    reset_poses_path: ~/workspace/arm-hand-teleop/configs/reset_poses/o10_dual_reset.json
    reset_gesture: cylindrical_straight
  camera_config_path: configs/cameras/o10_cameras.yaml
  cameras:
    top:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      rotation: ROTATE_180
    left_wrist: left_wrist
    right_wrist: right_wrist
