# O10 shared wrist camera registry.
#
# This file only stores parameters shared by the physical wrist RealSense
# cameras. Scene-specific camera keys such as top/left/right/right_wrist live in
# the control/record/infer YAML files.

wrist_camera_defaults:
  type: intelrealsense
  width: 640
  height: 480
  fps: 30
  use_depth: false
  color_mode: rgb
  rotation: NO_ROTATION

wrist_cameras:
  left_wrist:
    serial_number_or_name: "260322276846"

  right_wrist:
    serial_number_or_name: "260322273018"

camera_controls:
  right_wrist:
    auto_exposure: false
    exposure_us: 14000
    gain: 16
