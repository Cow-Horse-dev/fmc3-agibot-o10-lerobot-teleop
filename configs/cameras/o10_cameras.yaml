# O10 shared camera configuration.
#
# All O10 control / record / infer YAML files choose a profile from this file via:
#   robot.camera_config_path: configs/cameras/o10_cameras.yaml
#   robot.camera_profile: <profile_name>
#
# Tune camera exposure, serial numbers, resolution, and rotation here once instead
# of editing every left/right/dual config separately.

cameras:
  top:
    type: opencv
    index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    rotation: ROTATE_180

  top_h264:
    type: opencv
    index_or_path: /dev/v4l/by-id/usb-LRCP_500W_LRCP_500W_200901010001-video-index0
    width: 640
    height: 480
    fps: 30
    fourcc: h264
    rotation: ROTATE_180

  left_wrist:
    type: intelrealsense
    serial_number_or_name: "260322276846"
    width: 640
    height: 480
    fps: 30
    use_depth: false
    color_mode: rgb
    rotation: NO_ROTATION

  right_wrist:
    type: intelrealsense
    serial_number_or_name: "260322273018"
    width: 640
    height: 480
    fps: 30
    use_depth: false
    color_mode: rgb
    rotation: NO_ROTATION

camera_controls:
  right_wrist:
    auto_exposure: false
    exposure_us: 14000
    gain: 16

profiles:
  left_arm_control:
    cameras:
      top: top
      left_wrist: left_wrist

  left_arm_dataset:
    cameras:
      left: left_wrist
      top: top

  right_arm_control:
    cameras:
      top: top_h264
      right_wrist: right_wrist
    camera_controls:
      right_wrist: right_wrist

  right_arm_dataset:
    cameras:
      right: right_wrist
      top: top
    camera_controls:
      right: right_wrist

  dual_arm:
    cameras:
      top: top
      left_wrist: left_wrist
      right_wrist: right_wrist
    camera_controls:
      right_wrist: right_wrist
