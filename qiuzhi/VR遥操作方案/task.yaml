robot:
  robot_type: airbot_play # 机器人类型
  eef_type: none # 末端执行器类型 none, G2, INS_RH56DFX, INS_RH56BFX, INS_RH56E2, INS_RH56F1, BRAINCO_REVO1, BRAINCO_REVO2, ROH_LITES001, ROH_A002
  arm_sdk_type: thin # full-- 5.1.6, thin -- 5.2.7
  can_port: can0
  hand_id: 127

teleop:
  vr_device: pico_webrtc # quest_webrtc, pico_webrtc
  arm_device: pico_wrist  # pico_wrist(腕带), pico(手柄), quest
  hand_device: pico # 遥操作手设备 # udexreal, pico, quest
  handedness: right # left, right
  control_freq:
    udexreal_glove: 25 # 数据更新频率
    arm: 100 # 位置更新频率
    eef: 15 # 控制频率
  pose_port: 8000
  control_port: 8001

base:
  device_type: none # 移动底座类别 # none, go2
  zmq_port: 8002
  network_interface: wlp0s20f3

GUI: True  # False, True
